project:
  type: website
  output-dir: docs
  execute-dir: project
  render:
    - index.qmd
    - "notebooks/qi_modelling1.qmd"
    - "notebooks/qi_modelling_parallel.qmd"
    - "notebooks/bayesian_modelling.qmd"
    - "notebooks/sanity_checks.qmd"
    - "presentation/index.qmd"
    - "presentation_grud/index.qmd"

execute:
  freeze: auto

# --- Website Navigation ---
website:
  title: "STYCS P-Kinetics Manuscript"
  navbar:
    left:
      - href: index.html
        text: "Manuscript"
      
      # Add a dropdown menu for your analyses
      - text: "Supplementary Models"
        menu:
          - text: "Q/I & Thermodynamic Showdown"
            href: notebooks/qi_modelling1.html
          - text: "Digital Annex: Q/I Modeling of P Kinetics"
            href: notebooks/qi_modelling_parallel.html
          - text: "Bayesian Yield & Uptake Models"
            href: notebooks/bayesian_modelling.html
          - text: "Data Sanity Checks"
            href: notebooks/sanity_checks.html
      
      - text: "Presentation (Main)"
        href: presentation/index.html
      
      - text: "Presentation (GRUD)"
        href: presentation_grud/index.html

# --- Top-level settings ---
bibliography: 
  - references.bib
  - packages.bib
csl: apa.csl

# --- Format-specific settings ---
format:
  html:
    dev: svglite
    theme: cosmo
    toc: true
    toc-depth: 3
    number-sections: true
    html-math-method: mathjax
    grid:
      sidebar-width: 300px
      body-width: 900px
      margin-width: 250px
  pdf:
    dev: tikz