project:
  type: website
  output-dir: docs
  execute-dir: project
  render:
    - index.qmd
    - "notebooks/qi_modelling1.qmd"  # Explicitly render this specific notebook

execute:
  freeze: true

# --- Website Navigation ---
website:
  title: "STYCS P-Kinetics Manuscript"
  navbar:
    left:
      - href: index.html
        text: "Manuscript"
      
      # Add a dropdown menu for your analyses
      - text: "Supplementary Models"
        menu:
          - text: "Q/I & Thermodynamic Showdown"
            href: notebooks/qi_modelling1.html

# --- Top-level settings ---
bibliography: references.bib
csl: apa.csl

# --- Format-specific settings ---
format:
  html:
    theme: cosmo
    toc: true
    toc-depth: 3
    number-sections: true
    html-math-method: mathjax
    grid:
      sidebar-width: 300px
      body-width: 900px
      margin-width: 250px

  docx:
    toc: false 
    number-sections: true

  pdf:
    documentclass: article
    papersize: a4
    pdf-engine: lualatex
    number-sections: true
    mainfont: "Latin Modern Roman"
    sansfont: "Latin Modern Sans"
    monofont: "Latin Modern Mono"
    colorlinks: true
    geometry:
      - top=25mm
      - left=25mm
      - right=25mm
      - bottom=25mm